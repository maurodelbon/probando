name: Compilar app Android

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar proyecto Capacitor
        run: |
          mkdir -p cap/www
          cp index.html app.js seed.js mas.js gps.js styles.css sw.js manifest.webmanifest icon-192.png icon-512.png cap/www/
          cd cap
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7 @capacitor-community/background-geolocation@1.2.26
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.maurodelbon.asistentes",
            "appName": "Asistentes",
            "webDir": "www",
            "android": { "useLegacyBridge": true }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Permisos y icono
        run: |
          cd cap/android/app/src/main
          python3 - <<'PY'
          p = 'AndroidManifest.xml'
          s = open(p, encoding='utf8').read()
          perms = ['ACCESS_COARSE_LOCATION', 'ACCESS_FINE_LOCATION', 'ACCESS_BACKGROUND_LOCATION', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_LOCATION', 'POST_NOTIFICATIONS', 'WAKE_LOCK']
          add = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % x for x in perms if 'android.permission.%s"' % x not in s)
          s = s.replace('<application', add + '    <application', 1)
          open(p, 'w', encoding='utf8').write(s)
          PY
          rm -rf res/mipmap-anydpi-v26
          pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          src = Image.open(os.environ['GITHUB_WORKSPACE'] + '/icon-512.png').convert('RGBA')
          for d, n in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              os.makedirs('res/mipmap-' + d, exist_ok=True)
              for f in ['ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground']:
                  src.resize((n, n), Image.LANCZOS).save('res/mipmap-%s/%s.png' % (d, f))
          PY
          cat AndroidManifest.xml

      - name: Firma estable (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: asistentes-apk
          path: cap/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
